services:
  database:
    image: postgres:18.4
    container_name: postgres
    ports: 
      - 5432:5432
    environment:
      - POSTGRES_USER=igoryok
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=beautydb
    volumes:
      - beautyDB:/var/lib/postgresql

  panel:
    image: dpage/pgadmin4:9.16
    container_name: admin-panel
    ports:
      - 7000:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=user@domain.com
      - PGADMIN_DEFAULT_PASSWORD=password
volumes:
  beautyDB:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "/beautyDB"